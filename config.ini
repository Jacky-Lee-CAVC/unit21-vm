[colors]
background = #2B2B2B
background-alt = #313244
foreground = #cdd6f4
primary = #89b4fa
urgent = #f38ba8
success = #a6e3a1
warning = #f9e2af

[bar/main]
width = 100%
height = 24
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2

padding-left = 1
padding-right = 1
module-margin = 0

font-0 = "InconsolataGo Nerd Font Mono:style=Bold:size=12;2"

modules-left = powermenu separator i3
modules-center =
modules-right = network separator filesystem separator memory separator cpu separator date

enable-ipc = true

[module/i3]
type = internal/i3

format = <label-state>

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-visible = %name%
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2

format = <label>
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2

format = <label>
label = %used%/%total%

[module/network]
type = internal/network
interface = enp0s3
interval = 3

format-connected = <label-connected>
label-connected = %local_ip% (%downspeed:9%)

format-disconnected = <label-disconnected>
label-disconnected = down

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /

format-mounted = <label-mounted>
label-mounted = %used%/%total%

[module/date]
type = internal/date
interval = 1

date = %H:%M:%S
date-alt = %Y-%m-%d

format = <label>
label = %date% %date-alt%

[module/separator]
type = custom/text
format = " | "
content-foreground = ${colors.primary}

[module/powermenu]
type = custom/script
exec = echo ""
click-left = ~/.config/rofi/powermenu.sh
